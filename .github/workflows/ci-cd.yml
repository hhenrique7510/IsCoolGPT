name: CI/CD Pipeline - Staging & Production

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: iscoolgpt
  CONTAINER_NAME: iscoolgpt

jobs:
  
  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black mypy
    
    - name: Run flake8
      run: |
        flake8 app/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 app/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics
    
    - name: Check code formatting with black
      run: |
        black --check app/ tests/
    
    - name: Run mypy (type checking)
      run: |
        mypy app/ --ignore-missing-imports || true
      continue-on-error: true

  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    # Roda em paralelo com lint para acelerar o pipeline
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests
      run: |
        pytest tests/ -v --cov=app --cov-report=xml --cov-report=term
      env:
        LLM_PROVIDER: openai
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Determine environment
      id: env
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          echo "ENVIRONMENT=production" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=production-${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG_LATEST=production-latest" >> $GITHUB_OUTPUT
        elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
          echo "ENVIRONMENT=staging" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=staging-${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG_LATEST=staging-latest" >> $GITHUB_OUTPUT
        else
          echo "ENVIRONMENT=development" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=dev-${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG_LATEST=dev-latest" >> $GITHUB_OUTPUT
        fi
    
    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: |
          ${{ env.ECR_REPOSITORY }}:${{ steps.env.outputs.IMAGE_TAG }}
          ${{ env.ECR_REPOSITORY }}:${{ steps.env.outputs.IMAGE_TAG_LATEST }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Configure AWS credentials
      id: aws-credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
      continue-on-error: true
    
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
      if: steps.aws-credentials.outcome == 'success'
      continue-on-error: true
    
    - name: Push image to Amazon ECR
      if: steps.login-ecr.outcome == 'success'
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.env.outputs.IMAGE_TAG }}
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.env.outputs.IMAGE_TAG_LATEST }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Set outputs
      id: outputs
      if: steps.login-ecr.outcome == 'success'
      run: |
        echo "image_tag=${{ steps.env.outputs.IMAGE_TAG }}" >> $GITHUB_OUTPUT
        echo "environment=${{ steps.env.outputs.ENVIRONMENT }}" >> $GITHUB_OUTPUT
        echo "ecr_registry=${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_OUTPUT
    
    - name: AWS credentials not configured
      if: steps.aws-credentials.outcome == 'failure'
      run: |
        echo "⚠️ AWS credentials not configured. Skipping ECR push."
        echo "💡 To enable AWS deployment, configure GitHub Secrets:"
        echo "   - AWS_ACCESS_KEY_ID"
        echo "   - AWS_SECRET_ACCESS_KEY"


  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    
    env:
      ECS_CLUSTER: iscoolgpt-cluster-staging
      ECS_SERVICE: iscoolgpt-service-staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Configure AWS credentials
      id: aws-credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
      continue-on-error: true
    
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
      if: steps.aws-credentials.outcome == 'success'
      continue-on-error: true
    
    - name: Deploy to Staging ECS
      id: deploy-ecs
      if: steps.login-ecr.outcome == 'success'
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: staging-${{ github.sha }}
      run: |
        # Verificar se o serviço existe
        SERVICE_STATUS=$(aws ecs describe-services \
          --cluster ${{ env.ECS_CLUSTER }} \
          --services ${{ env.ECS_SERVICE }} \
          --region ${{ env.AWS_REGION }} \
          --query 'services[0].status' \
          --output text 2>/dev/null || echo "NOT_FOUND")
        
        if [ "$SERVICE_STATUS" = "ACTIVE" ]; then
          echo "🔄 Updating existing staging service..."
          # Zero downtime: rolling update com configuração otimizada
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --task-definition ${{ env.ECS_SERVICE }} \
            --force-new-deployment \
            --deployment-configuration "minimumHealthyPercent=100,maximumPercent=200" \
            --region ${{ env.AWS_REGION }}
          
          echo "✅ Staging service update initiated"
          
          # Aguardar deploy completar
          echo "⏳ Waiting for deployment to stabilize..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }} || true
          
          echo "✅ Staging deployment completed"
        else
          echo "⚠️ Staging service '${{ env.ECS_SERVICE }}' does not exist yet."
          echo "💡 To create the service, you need to:"
          echo "   1. Register Task Definition"
          echo "   2. Create ECS Service (requires VPC/Subnets)"
          echo "   See: PROXIMOS_PASSOS.md for details"
        fi
      continue-on-error: true
    
    - name: Get service URL
      id: service-url
      if: steps.deploy-ecs.outcome == 'success'
      run: |
        # Tentar obter URL do serviço (se configurado com ALB)
        echo "service_url=https://staging-api.iscoolgpt.example.com" >> $GITHUB_OUTPUT || true
      continue-on-error: true

  validate-staging:
    name: Validate Staging Deployment
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    
    - name: Wait for service to be ready
      run: |
        echo "⏳ Waiting for staging service to be ready..."
        STAGING_URL="${{ secrets.STAGING_API_URL || 'http://staging-api.iscoolgpt.example.com' }}"
        MAX_RETRIES=30
        RETRY_DELAY=10
        
        for i in $(seq 1 $MAX_RETRIES); do
          if curl -f -s "$STAGING_URL/health" > /dev/null 2>&1; then
            echo "✅ Service is ready!"
            exit 0
          fi
          echo "Attempt $i/$MAX_RETRIES: Service not ready yet, waiting ${RETRY_DELAY}s..."
          sleep $RETRY_DELAY
        done
        
        echo "⚠️ Service did not become ready in time"
        exit 1
      continue-on-error: true
    
    - name: Run integration tests
      run: |
        echo "🧪 Running integration tests against staging..."
        STAGING_URL="${{ secrets.STAGING_API_URL || 'http://staging-api.iscoolgpt.example.com' }}"
        pytest tests/integration/ -v \
          --tb=short \
          -m "not slow" \
          --maxfail=3
      env:
        STAGING_API_URL: ${{ secrets.STAGING_API_URL || 'http://staging-api.iscoolgpt.example.com' }}
        LLM_PROVIDER: mock
      continue-on-error: true
    
    - name: Run smoke tests
      run: |
        echo "💨 Running smoke tests..."
        STAGING_URL="${{ secrets.STAGING_API_URL || 'http://staging-api.iscoolgpt.example.com' }}"
        
        # Health check
        curl -f "$STAGING_URL/health" || exit 1
        
        # Root endpoint
        curl -f "$STAGING_URL/" || exit 1
        
        # Test /ask endpoint (pode falhar se não tiver API key, mas deve retornar 422, não 500)
        RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
          -X POST "$STAGING_URL/api/v1/ask" \
          -H "Content-Type: application/json" \
          -d '{"question":"test"}')
        
        if [ "$RESPONSE" -ge 500 ]; then
          echo "❌ Server error detected!"
          exit 1
        fi
        
        echo "✅ Smoke tests passed!"
      continue-on-error: true

  deploy-production:
    name: Deploy to Production (Zero Downtime)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    env:
      ECS_CLUSTER: iscoolgpt-cluster
      ECS_SERVICE: iscoolgpt-service
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Configure AWS credentials
      id: aws-credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
      continue-on-error: true
    
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
      if: steps.aws-credentials.outcome == 'success'
      continue-on-error: true
    
    - name: Deploy to Production ECS (Zero Downtime)
      id: deploy-ecs
      if: steps.login-ecr.outcome == 'success'
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: production-${{ github.sha }}
      run: |
        # Verificar se o serviço existe
        SERVICE_STATUS=$(aws ecs describe-services \
          --cluster ${{ env.ECS_CLUSTER }} \
          --services ${{ env.ECS_SERVICE }} \
          --region ${{ env.AWS_REGION }} \
          --query 'services[0].status' \
          --output text 2>/dev/null || echo "NOT_FOUND")
        
        if [ "$SERVICE_STATUS" = "ACTIVE" ]; then
          echo "🚀 Starting zero downtime deployment to production..."
          
          # Zero Downtime Deployment Configuration:
          # - minimumHealthyPercent=100: Mantém 100% das tasks antigas rodando
          # - maximumPercent=200: Permite até 200% (dobra as tasks durante deploy)
          # Isso garante que sempre há tasks saudáveis servindo tráfego
          
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --task-definition ${{ env.ECS_SERVICE }} \
            --force-new-deployment \
            --deployment-configuration "minimumHealthyPercent=100,maximumPercent=200" \
            --region ${{ env.AWS_REGION }}
          
          echo "✅ Production deployment initiated (zero downtime)"
          
          # Aguardar deploy completar e tasks ficarem healthy
          echo "⏳ Waiting for new tasks to become healthy..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }} || {
              echo "⚠️ Deployment may have issues, but continuing..."
            }
          
          # Verificar health das tasks
          echo "🔍 Verifying task health..."
          TASKS=$(aws ecs list-tasks \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service-name ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }} \
            --query 'taskArns[]' \
            --output text)
          
          HEALTHY_COUNT=0
          for TASK in $TASKS; do
            HEALTH=$(aws ecs describe-tasks \
              --cluster ${{ env.ECS_CLUSTER }} \
              --tasks $TASK \
              --region ${{ env.AWS_REGION }} \
              --query 'tasks[0].healthStatus' \
              --output text)
            
            if [ "$HEALTH" = "HEALTHY" ]; then
              HEALTHY_COUNT=$((HEALTHY_COUNT + 1))
            fi
          done
          
          echo "✅ Healthy tasks: $HEALTHY_COUNT"
          
          if [ $HEALTHY_COUNT -eq 0 ]; then
            echo "❌ No healthy tasks found! Deployment may have failed."
            echo "💡 Consider rolling back manually if needed."
            exit 1
          fi
          
          echo "✅ Zero downtime deployment completed successfully!"
        else
          echo "⚠️ Production service '${{ env.ECS_SERVICE }}' does not exist yet."
          echo "💡 To create the service, you need to:"
          echo "   1. Register Task Definition"
          echo "   2. Create ECS Service (requires VPC/Subnets)"
          echo "   See: PROXIMOS_PASSOS.md for details"
        fi
      continue-on-error: true
    
    - name: Get service URL
      id: service-url
      if: steps.deploy-ecs.outcome == 'success'
      run: |
        # Tentar obter URL do serviço (se configurado com ALB)
        echo "service_url=https://api.iscoolgpt.example.com" >> $GITHUB_OUTPUT || true
      continue-on-error: true
    
    - name: Verify production health
      if: steps.deploy-ecs.outcome == 'success'
      run: |
        echo "🔍 Verifying production health endpoint..."
        PROD_URL="${{ secrets.PRODUCTION_API_URL || 'https://api.iscoolgpt.example.com' }}"
        
        # Aguardar um pouco para garantir que está pronto
        sleep 10
        
        # Testar health endpoint
        if curl -f -s "$PROD_URL/health" > /dev/null; then
          echo "✅ Production health check passed!"
        else
          echo "⚠️ Production health check failed, but deployment completed."
          echo "💡 This may be normal if the service is still starting up."
        fi
      continue-on-error: true
