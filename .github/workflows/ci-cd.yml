name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: iscoolgpt
  ECS_CLUSTER: iscoolgpt-cluster
  ECS_SERVICE: iscoolgpt-service
  CONTAINER_NAME: iscoolgpt

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests
      run: |
        pytest tests/ -v --cov=app --cov-report=xml
      env:
        LLM_PROVIDER: openai
        # API keys não são necessárias para testes unitários básicos
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Build Docker image
      id: build-image
      env:
        IMAGE_TAG: ${{ github.sha }}
      run: |
        # Build Docker image (sempre funciona, mesmo sem AWS)
        docker build -t ${{ env.ECR_REPOSITORY }}:$IMAGE_TAG .
        docker tag ${{ env.ECR_REPOSITORY }}:$IMAGE_TAG ${{ env.ECR_REPOSITORY }}:latest
        echo "✅ Docker image built successfully"
        echo "image=${{ env.ECR_REPOSITORY }}:$IMAGE_TAG" >> $GITHUB_OUTPUT
    
    - name: Configure AWS credentials
      id: aws-credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
      continue-on-error: true
    
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
      if: steps.aws-credentials.outcome == 'success'
      continue-on-error: true
    
    - name: Push image to Amazon ECR
      if: steps.login-ecr.outcome == 'success'
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        # Tag and push to ECR (só se credenciais AWS estiverem configuradas)
        docker tag ${{ env.ECR_REPOSITORY }}:$IMAGE_TAG $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
        docker tag ${{ env.ECR_REPOSITORY }}:$IMAGE_TAG $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest
        docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
        docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest
        echo "✅ Image pushed to ECR"
    
    - name: AWS credentials not configured
      if: steps.aws-credentials.outcome == 'failure'
      run: |
        echo "⚠️ AWS credentials not configured. Skipping ECR push."
        echo "💡 To enable AWS deployment, configure GitHub Secrets:"
        echo "   - AWS_ACCESS_KEY_ID"
        echo "   - AWS_SECRET_ACCESS_KEY"

  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Configure AWS credentials
      id: aws-credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
      continue-on-error: true
    
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
      if: steps.aws-credentials.outcome == 'success'
      continue-on-error: true
    
    - name: Deploy to Amazon ECS
      id: deploy-ecs
      if: steps.login-ecr.outcome == 'success'
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        # Verificar se o serviço existe antes de atualizar
        if aws ecs describe-services \
          --cluster ${{ env.ECS_CLUSTER }} \
          --services ${{ env.ECS_SERVICE }} \
          --region ${{ env.AWS_REGION }} \
          --query 'services[0].status' \
          --output text 2>/dev/null | grep -q ACTIVE; then
          # Serviço existe, atualizar
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}
          echo "✅ Service updated successfully"
        else
          echo "⚠️ ECS Service '${{ env.ECS_SERVICE }}' does not exist yet."
          echo "💡 To create the service, you need to:"
          echo "   1. Register Task Definition"
          echo "   2. Create ECS Service (requires VPC/Subnets)"
          echo "   See: PROXIMOS_PASSOS.md for details"
        fi
      continue-on-error: true
    
    - name: AWS deployment skipped
      if: steps.aws-credentials.outcome == 'failure' || steps.deploy-ecs.outcome == 'failure'
      run: |
        if [ "${{ steps.aws-credentials.outcome }}" == "failure" ]; then
          echo "⚠️ AWS credentials not configured. Skipping ECS deployment."
          echo "💡 To enable AWS deployment, configure GitHub Secrets:"
          echo "   - AWS_ACCESS_KEY_ID"
          echo "   - AWS_SECRET_ACCESS_KEY"
        else
          echo "⚠️ ECS Service not found or deployment failed."
          echo "💡 This is normal if the ECS Service hasn't been created yet."
          echo "   The pipeline will continue - tests and build succeeded! ✅"
        fi

